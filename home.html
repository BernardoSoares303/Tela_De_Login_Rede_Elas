<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Rede Elas - Main Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="assets/css/home.css">

    <script src="assets/js/home.js" defer></script>
</head>

<body>

    <div class="container-fluid px-3 px-md-4 px-lg-5">

        <!-- Header -->
        <header class="mural-header">

            <div class="mural-header__logo">

                <div class="mural-header__logo-image"></div>

                <h1 class="mural-header__logo-title">
                    Rede Elas
                </h1>

            </div>

            <nav class="mural-header__nav">

                <button class="mural-header__button mural-header__button--active" id="btnInicio">
                    Início
                </button>

                <button class="mural-header__button" id="btnMural">
                    Mural
                </button>

                <button class="mural-header__button" id="btnAjuda">
                    Ajuda & Denúncia
                </button>

                <button class="mural-header__button" id="btnDoacoes">
                    Doações
                </button>

                <div class="admin-menu" id="adminMenu" style="display: none;">

                    <button class="mural-header__button" id="Painel__adm">
                        Painel Admin
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>

                    <div class="admin-menu__dropdown" id="adminDropdown">

                        <button class="admin-menu__item" id="btnUsuarios">
                            Controle de Usuários
                        </button>

                        <button class="admin-menu__item" id="btnDenuncias">
                            Controle de Denúncias
                        </button>

                    </div>

                </div>

            </nav>

            <button class="mural-header__logout" id="Logout">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>

        </header>

        <!-- Conteúdo -->
        <div class="row">

            <!-- Área Principal -->
            <div class="col-12 col-lg-9">

                <form class="mural-post" id="formRelato">

                    <i class="fa-solid fa-pencil mural-post__icon"></i>

                    <input type="text" class="mural-post__input" placeholder="Compartilhe o seu relato aqui..." required>

                    <button class="mural-post__button" type="submit">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>

                </form>

                <!-- Relatos renderizados pelo JS -->
                <section id="relatos-container">
                </section>

            </div>

            <!-- Sidebar -->
            <div class="col-12 col-lg-3">

                <aside class="community-card" id="btn-comunidades">

                    <h3 class="community-card__title">
                        Comunidades
                    </h3>

                    <div class="community-card__item">
                        <h4>Comunidade</h4>
                        <span>Comunidade...</span>
                    </div>

                    <div class="community-card__item">
                        <h4>Comunidade</h4>
                        <span>Comunidade...</span>
                    </div>

                    <div class="community-card__item">
                        <h4>Comunidade</h4>
                        <span>Comunidade...</span>
                    </div>

                </aside>

            </div>

        </div>

    </div>

    <!-- MODAL DENÚNCIA -->

    <div class="report-modal" id="reportModal">

        <div class="report-modal__content">

            <!-- HEADER -->

            <div class="report-modal__header">

                <h2 class="report-modal__title">
                    Denuncia:
                </h2>

                <button class="report-modal__close">
                    <i class="fa-regular fa-circle-xmark"></i>
                </button>

            </div>

            <!-- BODY -->

            <div class="report-modal__body">

                <textarea class="report-modal__textarea" placeholder="Descreva o motivo da denuncia ..."></textarea>

            </div>

            <!-- FOOTER -->

            <div class="report-modal__footer">

                <button class="report-modal__button">
                    Enviar Denuncia
                </button>

            </div>

        </div>

    </div>

</body>

</html>

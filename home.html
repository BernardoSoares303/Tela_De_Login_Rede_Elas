<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Rede Elas - Main Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="assets/css/home.css">

    <script src="assets/js/mural.js" defer></script>
</head>

<body>

    <div class="container-fluid px-3 px-md-4 px-lg-5">

        <!-- Header -->
        <header class="mural-header">

            <div class="mural-header__logo">

                <div class="mural-header__logo-image"></div>

                <h1 class="mural-header__logo-title">
                    Rede Elas
                </h1>

            </div>

            <nav class="mural-header__nav">

                <button class="mural-header__button mural-header__button--active">
                    Início
                </button>

                <button class="mural-header__button">
                    Mural
                </button>

                <button class="mural-header__button">
                    Ajuda & Denúncia
                </button>
                
                <button class="mural-header__button">
                    Painel Adm
                </button>

            </nav>

            <button class="mural-header__logout">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>

        </header>

        <!-- Conteúdo -->
        <div class="row">

            <!-- Área Principal -->
            <div class="col-12 col-lg-9">

                <div class="mural-post">

                    <i class="fa-solid fa-pencil mural-post__icon"></i>

                    <input type="text" class="mural-post__input" placeholder="Compartilhe o seu relato aqui...">

                    <button class="mural-post__button">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>

                </div>

                <!-- Relatos renderizados pelo JS -->
                <section id="relatos-container">
                </section>

            </div>

            <!-- Sidebar -->
            <div class="col-12 col-lg-3">

                <aside class="community-card">

                    <h3 class="community-card__title">
                        Comunidades
                    </h3>

                    <div class="community-card__item">
                        <h4>Comunidade</h4>
                        <span>Comunidade...</span>
                    </div>

                    <div class="community-card__item">
                        <h4>Comunidade</h4>
                        <span>Comunidade...</span>
                    </div>

                    <div class="community-card__item">
                        <h4>Comunidade</h4>
                        <span>Comunidade...</span>
                    </div>

                </aside>

            </div>

        </div>

    </div>

</body>

</html>

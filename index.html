<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tela Inicial</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<div class="layout">

    <!-- Lado esquerdo -->
    <div class="layout__left">
        <img src="assets/img/lateral.png" class="layout__image" alt="Imagem">
    </div>

    <!-- Lado direito -->
    <div class="layout__right">
        <div class="auth-card">

            <h3 class="auth-card__title">
                Seja Bem-vinda(o) ao Rede Elas!
            </h3>

            <h4 class="auth-card__subtitle">
                Você deseja:
            </h4>

            <button class="btn btn-primary auth-card__button">
                Fazer Login
            </button>

            <button class="btn btn-outline-primary auth-card__button">
                Criar Conta
            </button>

        </div>
    </div>

</div>

</body>
</html>
